<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Diff View — Free Online Text Compare, Side by Side &amp; Unified | S3eidat Tools</title>
<meta name="description" content="Compare two texts line by line with word-level highlights, side-by-side or unified view, ignore whitespace or case, and copy a standard unified diff. Free, private, nothing uploaded.">
<meta property="og:title" content="Diff View — free, private text compare">
<meta property="og:description" content="Side-by-side and unified diff with word-level highlights. Runs 100% in your browser.">
<meta property="og:image" content="screenshot.png">
<link rel="icon" href="kit/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="app.css">
<script src="kit/kit.js"></script>
</head>
<body data-tool="diff-view">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Diff View</h1>
    <p>Compare two texts line by line, with the exact words that changed highlighted. Side by side or unified, and a real unified diff to copy.</p>
  </section>

  <section class="card stack">
    <div class="grid-2">
      <label class="field">Original
        <textarea class="textarea" id="a" dir="auto" spellcheck="false" placeholder="Paste the original text…"></textarea>
      </label>
      <label class="field">Changed
        <textarea class="textarea" id="b" dir="auto" spellcheck="false" placeholder="Paste the changed text…"></textarea>
      </label>
    </div>
    <div class="row between">
      <div class="row">
        <button class="btn" id="swap"><svg class="i"><use href="#i-refresh"/></svg>Swap</button>
        <label class="check"><input type="checkbox" id="ws"> Ignore whitespace</label>
        <label class="check"><input type="checkbox" id="case"> Ignore case</label>
        <label class="check"><input type="checkbox" id="fold" checked> Fold unchanged</label>
      </div>
      <div class="row">
        <button class="btn ghost small" id="sample">Sample</button>
        <button class="btn ghost small" id="clear">Clear</button>
      </div>
    </div>
  </section>

  <section class="card mt stack">
    <div class="row between">
      <div class="row">
        <div class="seg" id="view" role="group" aria-label="View">
          <button aria-pressed="true" data-v="split">Side by side</button>
          <button aria-pressed="false" data-v="unified">Unified</button>
        </div>
        <span class="chip ok" id="added">+0</span>
        <span class="chip bad" id="removed">−0</span>
        <span class="faint" id="same"></span>
      </div>
      <div class="row">
        <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy diff</button>
        <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg>.diff</button>
      </div>
    </div>
    <div class="tbl-wrap dv-wrap" id="out"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
